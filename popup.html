<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 14px;
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, sans-serif;
    }
    .header { display: flex; justify-content: space-between; align-items: center; }
    h2 { font-size: 16px; margin: 0; color: #38bdf8; }
    .status { font-size: 11px; color: #94a3b8; margin: 10px 0; min-height: 16px; }
    .btn-row { display: flex; gap: 6px; margin-bottom: 12px; }
    button {
      padding: 10px 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-main { background: #2563eb; color: white; flex: 1; }
    .btn-main:hover { background: #1d4ed8; }
    .btn-clear { background: #334155; color: #f8fafc; display: none; }
    .stats {
      background: #1e293b;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .chunk-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
    .chunk-btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      text-align: left;
      width: 100%;
    }
    .chunk-btn:hover { border-color: #38bdf8; }
    .chunk-btn.copied { background: #166534; border-color: #22c55e; }
  </style>
</head>
<body>
  <div class="header">
    <h2>LLM Bridge 🚀</h2>
  </div>

  <p id="status" class="status">Ready to scrape chat</p>

  <div class="btn-row">
    <!-- Notice these specific IDs -->
    <button id="scrapeBtn" class="btn-main">⚡ Scrape and Optimize</button>
    <button id="clearBtn" class="btn-clear">Clear Memory Matrix</button>
  </div>

  <div id="statsBar" class="stats" style="display: none;">
    <span>Raw: <strong id="rawChars">0</strong></span>
    <span>Clean: <strong id="cleanChars">0</strong></span>
    <span>Chunks: <strong id="totalChunks">0</strong></span>
  </div>

  <div id="chunkList" class="chunk-list"></div>

  <script src="popup.js"></script>
</body>
</html>
